name: 'Compass — PR Context Brief'
description: >
  Generates a compact, evidence-linked context comment on a pull request
  using IBM Bob Shell. Identifies what changes, where to look, and what
  context matters — without review verdicts or automatic approval.

author: 'PR Compass team'

branding:
  icon: 'compass'
  color: 'blue'

inputs:
  owner:
    description: 'Repository owner (e.g. "octocat")'
    required: true
  repo:
    description: 'Repository name (e.g. "my-repo")'
    required: true
  pr_number:
    description: 'Pull request number'
    required: true
  github_token:
    description: >
      GitHub token with contents:read and pull-requests:write permissions.
      Pass as ${{ secrets.GITHUB_TOKEN }} — never hard-code.
    required: true
  bob_api_key:
    description: >
      IBM Bob Shell API key (Inference scope). Set as a repository secret.
      The key is passed via environment variable; never logged or printed.
      Live analysis is blocked when this is absent.
    required: false
    default: ''
  bob_path:
    description: 'Path to the bob executable (default: "bob")'
    required: false
    default: 'bob'
  dry_run:
    description: 'Set to "true" to run analysis without posting a comment'
    required: false
    default: 'false'
  allow_repair:
    description: 'Set to "true" to allow one Bob repair attempt on validation failure'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Check Compass package (offline)
      shell: bash
      working-directory: ${{ github.action_path }}
      run: node action-dist/index.mjs --check-package

    - name: Run Compass
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_OWNER: ${{ inputs.owner }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        BOB_API_KEY: ${{ inputs.bob_api_key }}
        BOBSHELL_API_KEY: ${{ inputs.bob_api_key }}
        BOB_PATH: ${{ inputs.bob_path }}
        COMPASS_DRY_RUN: ${{ inputs.dry_run }}
        COMPASS_ALLOW_REPAIR: ${{ inputs.allow_repair }}
      run: node action-dist/index.mjs
